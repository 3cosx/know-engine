<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 · 布布助手</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
    <!-- Inter 字体 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Vue 3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="da-login-app">
        <div class="da-login-card">
            <!-- 品牌 -->
            <div class="da-login-brand">
                <div class="da-login-logo"><i class="fas fa-robot"></i></div>
                <h1 class="da-login-title">布布助手</h1>
                <p class="da-login-subtitle">bubu · 登录</p>
            </div>

            <!-- 表单 -->
            <form class="da-login-form" @submit.prevent="onSubmit">
                <div class="da-login-field">
                    <label class="da-login-label">用户名</label>
                    <div class="da-login-input">
                        <input v-model="username" type="text" autocomplete="username"
                               placeholder="请输入用户名" required :disabled="loading"
                               ref="usernameInput" />
                        <i class="fas fa-user da-login-input-icon"></i>
                    </div>
                </div>
                <div class="da-login-field">
                    <label class="da-login-label">密码</label>
                    <div class="da-login-input">
                        <input v-model="password" :type="showPassword ? 'text' : 'password'"
                               :autocomplete="showPassword ? 'off' : 'current-password'"
                               placeholder="请输入密码" required :disabled="loading" />
                        <i class="fas fa-lock da-login-input-icon"></i>
                        <button type="button" class="da-login-suffix" @click="showPassword = !showPassword"
                                :title="showPassword ? '隐藏密码' : '显示密码'">
                            <i :class="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                        </button>
                    </div>
                </div>

                <div v-if="errorMsg" class="da-login-error">
                    <i class="fas fa-circle-exclamation"></i>
                    <span>{{ errorMsg }}</span>
                </div>

                <button type="submit" class="da-login-submit" :disabled="loading">
                    <span v-if="!loading">登 录</span>
                    <span v-else><i class="fas fa-spinner fa-spin"></i> 登录中…</span>
                </button>
            </form>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
